
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.55" stop-color="#F47A20"/>
      <stop offset="1" stop-color="#B94312"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFAA42"/>
      <stop offset="1" stop-color="#D65B18"/>
    </linearGradient>
  </defs>

  <g shape-rendering="crispEdges" stroke="#71300F" stroke-width="5" stroke-linejoin="miter">

    <!-- Antenna -->
    <rect x="153" y="13" width="14" height="25" fill="#F47A20"/>
    <rect x="143" y="3" width="34" height="17" fill="#FFB347"/>
    <rect x="148" y="8" width="24" height="7" fill="#FFD58A" stroke="none"/>

    <!-- Head shadow -->
    <rect x="67" y="42" width="186" height="157" fill="#71300F"/>

    <!-- Head -->
    <path d="M78 43 H242 V181 H78 Z" fill="url(#orange)"/>
    <rect x="78" y="43" width="164" height="13" fill="#FFC16B" stroke="none"/>
    <rect x="78" y="56" width="13" height="112" fill="#FFB347" stroke="none"/>
    <rect x="229" y="56" width="13" height="112" fill="#B94312" stroke="none"/>
    <rect x="91" y="168" width="138" height="13" fill="#C94F15" stroke="none"/>

    <!-- Head pixel highlights -->
    <rect x="100" y="67" width="22" height="12" fill="#FFD58A" stroke="none"/>
    <rect x="122" y="67" width="12" height="12" fill="#FFD58A" stroke="none"/>
    <rect x="91" y="80" width="12" height="24" fill="#FFC16B" stroke="none"/>

    <!-- Eyes -->
    <rect x="105" y="96" width="36" height="39" fill="#251D29"/>
    <rect x="179" y="96" width="36" height="39" fill="#251D29"/>
    <rect x="112" y="101" width="12" height="12" fill="#FFFFFF" stroke="none"/>
    <rect x="186" y="101" width="12" height="12" fill="#FFFFFF" stroke="none"/>
    <rect x="128" y="119" width="8" height="8" fill="#F8A13A" stroke="none"/>
    <rect x="202" y="119" width="8" height="8" fill="#F8A13A" stroke="none"/>

    <!-- Pixel smile -->
    <rect x="127" y="148" width="66" height="10" fill="#71300F"/>
    <rect x="127" y="158" width="12" height="10" fill="#71300F"/>
    <rect x="181" y="158" width="12" height="10" fill="#71300F"/>
    <rect x="139" y="158" width="42" height="9" fill="#FFF0D6" stroke="none"/>

    <!-- Side ears -->
    <rect x="48" y="91" width="19" height="43" fill="#D65B18"/>
    <rect x="253" y="91" width="19" height="43" fill="#B94312"/>
    <rect x="53" y="102" width="10" height="17" fill="#FFB347" stroke="none"/>
    <rect x="257" y="102" width="10" height="17" fill="#FFB347" stroke="none"/>

    <!-- Neck -->
    <rect x="132" y="199" width="56" height="16" fill="#A94416"/>

    <!-- Body -->
    <path d="M96 215 H224 V289 H96 Z" fill="url(#body)"/>
    <rect x="96" y="215" width="128" height="12" fill="#FFC16B" stroke="none"/>
    <rect x="96" y="227" width="13" height="49" fill="#FFB347" stroke="none"/>
    <rect x="211" y="227" width="13" height="49" fill="#B94312" stroke="none"/>

    <!-- Chest screen -->
    <rect x="130" y="238" width="60" height="35" fill="#2A2632"/>
    <rect x="139" y="246" width="12" height="10" fill="#7CF5C5" stroke="none"/>
    <rect x="155" y="246" width="12" height="10" fill="#7CF5C5" stroke="none"/>
    <rect x="171" y="246" width="10" height="10" fill="#7CF5C5" stroke="none"/>
    <rect x="139" y="262" width="42" height="5" fill="#F8A13A" stroke="none"/>

    <!-- Arms -->
    <path d="M96 222 H73 V239 H62 V272 H83 V255 H96 Z" fill="#E96B1B"/>
    <path d="M224 222 H247 V239 H258 V272 H237 V255 H224 Z" fill="#C94F15"/>
    <rect x="63" y="259" width="20" height="13" fill="#FFB347" stroke="none"/>
    <rect x="237" y="259" width="20" height="13" fill="#F47A20" stroke="none"/>

    <!-- Legs -->
    <rect x="112" y="289" width="34" height="22" fill="#A94416"/>
    <rect x="174" y="289" width="34" height="22" fill="#A94416"/>
    <rect x="103" y="307" width="48" height="18" fill="#F47A20"/>
    <rect x="169" y="307" width="48" height="18" fill="#D65B18"/>
    <rect x="109" y="307" width="28" height="6" fill="#FFB347" stroke="none"/>
    <rect x="175" y="307" width="28" height="6" fill="#FFB347" stroke="none"/>

